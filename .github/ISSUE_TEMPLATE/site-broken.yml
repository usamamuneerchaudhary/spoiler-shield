name: Nothing is blurred on a site
description: A site changed its layout and the shield stopped working there.
title: "Not working on [site]"
labels: [site-support]
body:
  - type: dropdown
    id: site
    attributes:
      label: Site
      options: [YouTube, Reddit, X]
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page type
      placeholder: "e.g. home feed, search results, a video page, comments"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "e.g. Chrome 153, Firefox 146"
